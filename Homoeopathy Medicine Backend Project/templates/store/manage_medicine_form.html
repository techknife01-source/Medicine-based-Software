{% extends 'manage_base.html' %}{% block title %}Edit medicine | VerdantCare{% endblock %}{% block management_content %}<div class="management-heading"><div><p class="eyebrow">Catalogue / Edit</p><h1>{{ medicine.name }}</h1></div><a class="text-link" href="{% url 'medicine_management' %}">Back to medicines</a></div><section class="form-panel"><form method="post" enctype="multipart/form-data" class="management-form">{% csrf_token %}<div class="form-grid"><label>Medicine name<input name="name" value="{{ medicine.name }}" required></label><label>Category<input name="category" value="{{ medicine.category }}" required></label><label>Price<input name="price" type="number" step="0.01" value="{{ medicine.price }}" required></label><label>Discount %<input name="discount_percent" type="number" step="0.01" min="0" max="100" value="{{ medicine.discount_percent }}"></label><label>Stock<input name="stock" type="number" min="0" value="{{ medicine.stock }}" required></label><label>Replace image<input name="image" type="file" accept="image/*"></label></div><label>Description<textarea name="description" rows="4">{{ medicine.description }}</textarea></label><label>Image URL<input name="image_url" type="url" value="{{ medicine.image_url }}"></label><label class="check-label"><input name="featured" type="checkbox" {% if medicine.featured %}checked{% endif %}> Feature on the storefront</label><button class="button button-dark" type="submit">Update medicine <span>-></span></button></form></section>{% endblock %}
