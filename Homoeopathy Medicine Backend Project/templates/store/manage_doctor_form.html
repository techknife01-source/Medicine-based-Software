{% extends 'manage_base.html' %}{% block title %}Edit doctor | VerdantCare{% endblock %}{% block management_content %}<div class="management-heading"><div><p class="eyebrow">Care team / Edit</p><h1>Dr. {{ doctor.name }}</h1></div><a class="text-link" href="{% url 'doctor_management' %}">Back to doctors</a></div><section class="form-panel"><form method="post" class="management-form">{% csrf_token %}<div class="form-grid"><label>Full name<input name="name" value="{{ doctor.name }}" required></label><label>Specialty<input name="specialty" value="{{ doctor.specialty }}" required></label><label>Qualification<input name="qualification" value="{{ doctor.qualification }}"></label><label>Experience years<input name="experience_years" type="number" min="0" value="{{ doctor.experience_years }}"></label><label>Consultation fee<input name="consultation_fee" type="number" step="0.01" value="{{ doctor.consultation_fee }}" required></label></div><label>Bio<textarea name="bio" rows="4">{{ doctor.bio }}</textarea></label><label class="check-label"><input name="available" type="checkbox" {% if doctor.available %}checked{% endif %}> Available for new appointments</label><button class="button button-dark" type="submit">Update doctor <span>-></span></button></form></section>{% endblock %}
